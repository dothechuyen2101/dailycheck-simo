<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SIMO Daily Check{% endblock %}</title>
<!-- <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"> -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

<style>
  body { background: #f0f2f5; }
  .navbar-brand { font-weight: 700; letter-spacing: 1px; }
  .card { border: none; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  .badge-OK      { background: #28a745; }
  .badge-WARNING { background: #ffc107; color:#333; }
  .badge-CRITICAL{ background: #dc3545; }
  .badge-ERROR   { background: #6c757d; }
  .status-dot { width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px; }
  .dot-OK       { background:#28a745; }
  .dot-WARNING  { background:#ffc107; }
  .dot-CRITICAL { background:#dc3545; }
  .dot-ERROR    { background:#6c757d; }
  pre { font-size: 11px; max-height: 200px; overflow-y: auto; background:#1e1e1e;
        color:#d4d4d4; padding:10px; border-radius:4px; }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <div class="d-flex align-items-center gap-3">
      <a class="navbar-brand" href="/">📊 SIMO Daily Check</a>
      <a class="text-light text-decoration-none small" href="/modules">Dynamic Modules</a>
      <a class="text-light text-decoration-none small" href="/commands">Lệnh Built-in</a>
    </div>
    <span class="text-light small">{{ now }}</span>
  </div>
</nav>
<div class="container-fluid px-4">
  {% block content %}{% endblock %}
</div>
<!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> -->
 <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

{% block scripts %}{% endblock %}
</body>
</html>
