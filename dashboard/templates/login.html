<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập – SIMO Daily Check</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0f1117;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  /* Animated gradient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 30%, rgba(79,142,247,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 70%, rgba(167,139,250,0.12) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .login-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 16px;
  }
  .login-card {
    background: rgba(26, 29, 46, 0.9);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px 36px;
    backdrop-filter: blur(20px);
    box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(79,142,247,0.1);
  }
  .brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-icon {
    font-size: 48px;
    margin-bottom: 10px;
    display: block;
    filter: drop-shadow(0 0 20px rgba(79,142,247,0.5));
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(79,142,247,0.5)); }
    50%       { filter: drop-shadow(0 0 32px rgba(167,139,250,0.7)); }
  }
  .brand-title {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, #4f8ef7, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .brand-sub {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
  }
  .form-label {
    color: #94a3b8;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    display: block;
  }
  .form-control {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: #e2e8f0;
    padding: 10px 14px;
    font-size: 14px;
    transition: all 0.2s;
    width: 100%;
  }
  .form-control:focus {
    background: rgba(79,142,247,0.1);
    border-color: rgba(79,142,247,0.5);
    outline: none;
    box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
    color: #fff;
  }
  .form-control::placeholder { color: rgba(255,255,255,0.25); }
  .form-group { margin-bottom: 20px; }
  .btn-login {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f8ef7, #7c3aed);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(79,142,247,0.35);
    position: relative;
    overflow: hidden;
    margin-top: 8px;
  }
  .btn-login::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1));
    transition: opacity 0.2s;
  }
  .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(79,142,247,0.5); }
  .btn-login:active { transform: translateY(0); }
  .error-box {
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.35);
    border-radius: 10px;
    color: #fca5a5;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .footer-note {
    text-align: center;
    color: rgba(255,255,255,0.2);
    font-size: 11px;
    margin-top: 28px;
  }
  /* Decorative floating circles */
  .deco {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .deco1 {
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(79,142,247,0.08), transparent 70%);
    top: -80px; left: -100px;
    animation: float 8s ease-in-out infinite;
  }
  .deco2 {
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(167,139,250,0.1), transparent 70%);
    bottom: -60px; right: -80px;
    animation: float 10s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translate(0,0); }
    50%       { transform: translate(20px, -20px); }
  }
</style>
</head>
<body>
<div class="deco deco1"></div>
<div class="deco deco2"></div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">📊</span>
      <div class="brand-title">SIMO Daily Check</div>
      <div class="brand-sub">Hệ thống kiểm tra vận hành hàng ngày</div>
    </div>

    {% if error %}
    <div class="error-box">
      <span>⚠️</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <input
          id="username"
          name="username"
          type="text"
          class="form-control"
          placeholder="Nhập username…"
          autocomplete="username"
          autofocus
          required
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-control"
          placeholder="Nhập mật khẩu…"
          autocomplete="current-password"
          required
        >
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        🔐 Đăng nhập
      </button>
    </form>

    <div class="footer-note">SIMO Daily Check &copy; {{ now[:4] }}</div>
  </div>
</div>

<script>
document.querySelector('form').addEventListener('submit', function() {
  var btn = document.getElementById('loginBtn');
  btn.textContent = 'Đang đăng nhập…';
  btn.disabled = true;
});
</script>
</body>
</html>
